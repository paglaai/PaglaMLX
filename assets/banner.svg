<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#151a22"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7f77dd" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7f77dd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfeee2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#2a2f38" stroke-width="1"/>

  <!-- routing dots motif, echoes the local/cloud routing concept -->
  <circle cx="120" cy="70" r="3" fill="#1D9E75" opacity="0.7"/>
  <circle cx="150" cy="60" r="2" fill="#1D9E75" opacity="0.4"/>
  <line x1="120" y1="70" x2="150" y2="60" stroke="#1D9E75" stroke-width="1" opacity="0.3"/>
  <circle cx="1080" cy="230" r="3" fill="#f0997b" opacity="0.7"/>
  <circle cx="1050" cy="245" r="2" fill="#f0997b" opacity="0.4"/>
  <line x1="1080" y1="230" x2="1050" y2="245" stroke="#f0997b" stroke-width="1" opacity="0.3"/>
  <circle cx="1000" cy="60" r="2.5" fill="#7f77dd" opacity="0.6"/>

  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#titleGrad)" letter-spacing="-1">PaglaMLX</text>

  <text x="600" y="192" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="4" fill="#9aa1ad">LOCAL LLM ORCHESTRATION FOR APPLE SILICON</text>
</svg>
