name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Copy wiki pages
        run: |
          mkdir -p build/wiki
          if [ -d wiki ]; then
            cp wiki/*.md build/wiki/ 2>/dev/null || echo "No wiki md files"
          fi
          # Convert wiki markdown to basic HTML for Pages
          if command -v npx &>/dev/null && npx --yes markdown-to-html --help &>/dev/null 2>&1; then
            for f in build/wiki/*.md; do
              [ -f "$f" ] && npx --yes markdown-to-html "$f" > "${f%.md}.html" 2>/dev/null || true
            done
          fi

      - name: Override with static landing page
        run: |
          cp static/index.html build/index.html
          cp static/api-reference.html build/api-reference.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
