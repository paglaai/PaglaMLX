name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build DMG
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test --parallel

      - name: Build release
        run: swift build -c release --product PaglaMLX

      - name: Build DMG
        run: bash build_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaglaMLX-dmg
          path: PaglaMLX.dmg
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: build-dmg
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: PaglaMLX-dmg

      - name: Parse version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk '/^## /{if(++c==2) exit} c==1' CHANGELOG.md | tail -n +2)
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=See commits for details." >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PaglaMLX ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          files: PaglaMLX.dmg
          fail_on_unmatched_files: true
