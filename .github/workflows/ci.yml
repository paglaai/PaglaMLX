name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'fern/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS ${{ matrix.macos }})
    runs-on: ${{ matrix.macos }}
    strategy:
      matrix:
        macos: [macos-15]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build -c debug --product PaglaMLX

      - name: Run tests
        run: swift test --parallel

      - name: Build (release)
        run: swift build -c release --product PaglaMLX

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint --strict
          else
            echo "swiftlint not installed, installing..."
            brew install swiftlint
            swiftlint --strict
          fi
        continue-on-error: true
